<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta http-equiv="Content-Security-Policy"
        content="default-src 'self' 'unsafe-inline' data: file:; img-src 'self' data: file:; media-src 'self' data: file:;" />
  <title>Tipejos</title>
  <style>
    html, body {
      margin: 0; padding: 0;
      width: 100%; height: 100%;
      background: transparent;
      overflow: hidden;
      pointer-events: none;
      user-select: none;
      -webkit-user-select: none;
    }

    #stage { position: absolute; inset: 0; }

    /* Las capas del sprite se posicionan a BUBBLE_PAD px del tope (ver renderer.js). */
    .pet-overlay {
      position: absolute;
      left: 0;
      background-repeat: no-repeat;
      pointer-events: none;
      image-rendering: pixelated;
      will-change: background-position;
      transform: translateZ(0);     /* fuerza capa GPU propia → sin parpadeo al actualizar */
    }

    /* Zona de arrastre encima del sprite. */
    #hit {
      position: absolute;
      left: 0;
      z-index: 100;
      pointer-events: auto;
      cursor: grab;
    }
    #hit.dragging { cursor: grabbing; }

    :root { --bubble-fs: 14px; }

    /* Globo de diálogo sobre el sprite. */
    #bubble {
      position: absolute;
      /* Centrado sobre el sprite; se ajusta al contenido (más cuadrado) y
         envuelve al llegar al max-width. `bottom` se fija desde renderer.js. */
      left: 50%;
      transform: translateX(-50%) translateZ(0); /* capa GPU propia = sin desfase en drag */
      will-change: opacity;
      width: max-content;
      max-width: 200px;
      min-width: 76px;
      box-sizing: border-box;
      background: #fffef0;
      border: 1px solid #555;
      border-radius: 14px;
      padding: 9px 13px;
      font-family: 'Segoe UI', Tahoma, sans-serif;
      font-size: var(--bubble-fs);
      line-height: 1.35;
      color: #222;
      text-align: center;
      word-break: break-word;
      overflow-wrap: anywhere;
      pointer-events: none;
      z-index: 200;
      opacity: 0;
      transition: opacity 0.2s ease;
      box-shadow: 1px 2px 5px rgba(0,0,0,0.20);
    }
    #bubble.visible { opacity: 1; }

    /* Triángulo apuntando hacia abajo (hacia el muñequito). Dos capas:
       el borde oscuro y, encima, el relleno claro del globo. */
    #bubble::after {
      content: '';
      position: absolute;
      bottom: -8px;
      left: 50%;
      transform: translateX(-50%);
      border: 7px solid transparent;
      border-bottom: 0;
      border-top-color: #555;
    }
    #bubble::before {
      content: '';
      position: absolute;
      bottom: -6px;
      left: 50%;
      transform: translateX(-50%);
      border: 6px solid transparent;
      border-bottom: 0;
      border-top-color: #fffef0;
      z-index: 1;
    }
  </style>
</head>
<body>
  <div id="stage">
    <div id="bubble"><span id="bubble-text"></span></div>
    <div id="hit"></div>
  </div>
  <script src="phrases.js"></script>
  <script src="renderer.js"></script>
</body>
</html>
